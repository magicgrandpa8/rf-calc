<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22313F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RF Calc">
<meta name="format-detection" content="telephone=no">
<title>RF Band Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --navy: #22313F;
    --navy-2: #2C3E50;
    --bg: #EEF1F5;
    --card: #FFFFFF;
    --text: #24303C;
    --muted: #6B7785;
    --line: #E1E6EC;
    --field: #F5F7FA;
    --err: #C0392B;
    --warn: #B7791F;
    --ok: #2F855A;
    --accent: #2B7A9E;
    --accent-soft: #E3F0F6;
    --accent-on-dark: #6CB8DA;
    --tabbar-h: 58px;
    --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181E;
      --card: #1B232B;
      --text: #E6ECF2;
      --muted: #93A1AF;
      --line: #2A3540;
      --field: #232D37;
      --err: #F07167;
      --warn: #E9B44C;
      --ok: #6BCB8B;
      --accent-soft: rgba(255, 255, 255, 0.07);
    }
    .readout { background: #1E2B38; border: 1px solid #2E3D4C; }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.45;
    color: var(--text);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- 標題列 ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--navy);
    color: #fff;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
  }
  .appbar-row { display: flex; align-items: center; gap: 8px; max-width: 680px; margin: 0 auto; }
  .appbar h1 { flex: 1; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
  .iconbtn {
    width: 40px; height: 40px; border: 0; border-radius: 10px;
    background: rgba(255, 255, 255, 0.08); color: #fff;
    display: grid; place-items: center;
  }
  .iconbtn:active { background: rgba(255, 255, 255, 0.18); }
  .iconbtn svg { width: 21px; height: 21px; }
  .appbar-strip { height: 3px; margin: 10px -16px 0; background: var(--accent); transition: background 0.25s; }

  main {
    max-width: 680px; margin: 0 auto;
    padding: 14px 14px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 24px);
  }

  /* ---------- 頻譜讀數面板（深色儀器風格） ---------- */
  .readout {
    background: var(--navy);
    border-radius: 14px;
    padding: 12px 12px 6px;
    color: #E6ECF2;
    margin-bottom: 14px;
  }
  .readout svg { display: block; width: 100%; }

  /* ---------- 卡片與表單 ---------- */
  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 4px 16px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
  }
  .seg {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
    background: var(--field); border-radius: 10px; padding: 3px; margin: 12px 0 4px;
  }
  .seg button {
    border: 0; border-radius: 8px; padding: 8px 4px; background: transparent;
    font-size: 15px; font-weight: 600; color: var(--muted);
  }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--accent); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }
  .field { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; }
  .field > label { flex: 1; min-width: 0; color: var(--text); }
  .field > label small { display: block; color: var(--muted); font-size: 12px; }
  .ctl { display: flex; align-items: center; gap: 6px; justify-content: flex-end; max-width: 62%; }
  .ctl select, .ctl input {
    min-width: 0; max-width: 100%;
    border: 1px solid transparent; border-radius: 9px;
    background: var(--field); padding: 8px 10px;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  .ctl select { text-align-last: right; padding-right: 26px; appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 12px center, right 7px center; background-size: 5px 5px; background-repeat: no-repeat; }
  .ctl input { width: 128px; }
  .ctl input:focus, .ctl select:focus { border-color: var(--accent); outline: none; }
  .ctl input[disabled] { color: var(--muted); }
  .ctl .unit { color: var(--muted); font-size: 14px; min-width: 2.2em; }
  .ctl input.invalid { border-color: var(--err); }
  .stepbtn {
    width: 36px; height: 36px; border-radius: 9px; border: 0;
    background: var(--accent-soft); color: var(--accent); font-size: 20px; font-weight: 600; line-height: 1;
  }
  .stepbtn:active { filter: brightness(0.92); }
  .note { color: var(--muted); font-size: 13px; padding: 2px 2px 14px; }

  .msg { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; font-weight: 600;
    padding: 10px 14px; border-radius: 12px; margin-bottom: 14px; background: var(--card); border: 1px solid var(--line); }
  .msg.warn { color: var(--warn); }
  .msg.err { color: var(--err); }
  .msg.info { color: var(--muted); }
  .msg[hidden] { display: none; }

  /* ---------- 結果 ---------- */
  .group h2 { font-size: 13px; font-weight: 700; color: var(--accent); margin: 18px 4px 6px; }
  .group dl { margin: 0; background: var(--card); border-radius: 14px; border: 1px solid var(--line); padding: 0 16px; }
  .row { display: flex; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .row:last-child { border-bottom: 0; }
  .row dt { color: var(--muted); flex: 0 0 auto; max-width: 46%; }
  .row dd { margin: 0 0 0 auto; text-align: right; font-variant-numeric: tabular-nums; word-break: break-word; user-select: text; -webkit-user-select: text; }

  /* ---------- 底部分頁 ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .tabbar-inner { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 680px; margin: 0 auto; height: var(--tabbar-h); }
  .tab { border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; }
  .tab svg { width: 24px; height: 24px; }
  .tab[aria-selected="true"] { color: var(--tab-color, var(--accent)); font-weight: 600; }

  /* ---------- 底部面板（總表 / 關於） ---------- */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(10, 16, 22, 0.45); z-index: 40; opacity: 0; transition: opacity 0.2s; }
  .sheet-backdrop.open { opacity: 1; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    max-height: 88vh; display: flex; flex-direction: column;
    background: var(--card); border-radius: 18px 18px 0 0;
    transform: translateY(100%); transition: transform 0.25s ease;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    max-width: 760px; margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet header { display: flex; align-items: center; padding: 14px 16px 8px; gap: 8px; }
  .sheet header h3 { flex: 1; margin: 0; font-size: 17px; }
  .sheet header button { border: 0; background: var(--field); border-radius: 9px; padding: 7px 14px; font-weight: 600; color: var(--accent); }
  .sheet .sheet-note { padding: 0 16px 8px; color: var(--muted); font-size: 12px; }
  .sheet .sheet-body { overflow: auto; -webkit-overflow-scrolling: touch; padding: 0 0 12px; }
  .dtable { border-collapse: collapse; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 100%; }
  .dtable th { position: sticky; top: 0; background: var(--card); color: var(--muted); text-align: left; font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .dtable td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .dtable td:first-child, .dtable th:first-child { padding-left: 16px; font-weight: 600; }
  .dtable tbody tr:active { background: var(--accent-soft); }
  .about { padding: 0 16px 16px; font-size: 14px; color: var(--muted); }
  .about p { margin: 0 0 12px; }
  .about strong { color: var(--text); }
  .about .status { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 600; margin-bottom: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
  .dot.ready { background: var(--ok); }

  /* ---------- 提示 ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px);
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50;
    transition: opacity 0.2s, transform 0.2s; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .install-tip { display: flex; gap: 10px; align-items: center; font-size: 13px; background: var(--accent-soft);
    color: var(--text); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; }
  .install-tip button { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 18px; }
  .install-tip[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet-backdrop, .toast, .appbar-strip { transition: none; }
  }
</style>
</head>
<body>
  <header class="appbar">
    <div class="appbar-row">
      <h1 id="title">4G LTE</h1>
      <button class="iconbtn" id="btnTable" aria-label="總表">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/></svg>
      </button>
      <button class="iconbtn" id="btnShare" aria-label="分享結果">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V19a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-6.5"/></svg>
      </button>
      <button class="iconbtn" id="btnAbout" aria-label="關於">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.6v.1"/></svg>
      </button>
    </div>
    <div class="appbar-strip"></div>
  </header>

  <main>
    <div class="install-tip" id="installTip" hidden>
      <span>點選 Safari 下方的「分享」→「加入主畫面」，之後沒有網路也能使用。</span>
      <button id="installTipClose" aria-label="關閉提示">×</button>
    </div>
    <section class="readout" id="readout" aria-label="頻譜示意"></section>
    <section class="card" id="inputs"></section>
    <div class="msg" id="msg" role="status" hidden></div>
    <section id="results"></section>
  </main>

  <nav class="tabbar" aria-label="功能">
    <div class="tabbar-inner" role="tablist">
      <button class="tab" role="tab" data-tool="CELL" style="--tab-color:#2B7A9E">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 11v9.5M9.5 20.5h5"/><circle cx="12" cy="9.5" r="1.6"/><path d="M8.3 6a5.2 5.2 0 0 0 0 7M15.7 6a5.2 5.2 0 0 1 0 7M5.5 3.5a9 9 0 0 0 0 12M18.5 3.5a9 9 0 0 1 0 12"/></svg>
        <span>行動網路</span>
      </button>
      <button class="tab" role="tab" data-tool="WIFI" style="--tab-color:#2E8B74">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9.2a13 13 0 0 1 18 0M6 12.6a8.6 8.6 0 0 1 12 0M9 16a4.2 4.2 0 0 1 6 0"/><circle cx="12" cy="19.2" r="1.1" fill="currentColor"/></svg>
        <span>Wi-Fi</span>
      </button>
      <button class="tab" role="tab" data-tool="GNSS" style="--tab-color:#B07A2E">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></svg>
        <span>GNSS</span>
      </button>
      <button class="tab" role="tab" data-tool="CABLE" style="--tab-color:#9A5B7A">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20c0-6 4-6 8-8s8-2 8-8"/><rect x="2.5" y="17.5" width="4" height="4" rx="1"/><rect x="17.5" y="2.5" width="4" height="4" rx="1"/></svg>
        <span>Cable Loss</span>
      </button>
      <button class="tab" role="tab" data-tool="FSPL" style="--tab-color:#5F7F3C">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.8"/><path d="M9 8.5a5 5 0 0 1 0 7M12.5 5.5a9.2 9.2 0 0 1 0 13M16 3a13 13 0 0 1 0 18"/></svg>
        <span>FSPL</span>
      </button>
    </div>
  </nav>

  <div class="sheet-backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <header><h3 id="sheetTitle"></h3><button id="sheetClose">關閉</button></header>
    <div class="sheet-note" id="sheetNote"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
